# Badges — XcodeGen project definition.
# Regenerate the .xcodeproj any time with:  xcodegen generate
# (brew install xcodegen)
name: Badges

options:
  bundleIdPrefix: com.matyasnowak
  deploymentTarget:
    macOS: "14.6"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Xcode 16+ wraps Debug builds in a "debug dylib" stub for previews/hot-reload.
    # System-loaded app extensions (FinderSync, QuickLook) don't init through that
    # stub — the extension process starts but its principal class never runs. Force
    # a normal single-binary build so the extensions actually load.
    ENABLE_DEBUG_DYLIB: NO
    # Set your Apple Development team once here and every target inherits it.
    # IMPORTANT: the same Team ID must also match TEAMID in
    # Shared/BadgeStore.swift (appGroupID) — the app group is Team-ID-prefixed.
    DEVELOPMENT_TEAM: ATQ3U47NSK

targets:
  Badges:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - BadgeAssets.xcassets
    dependencies:
      - target: BadgesFinderExt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matyasnowak.badges
        PRODUCT_NAME: Badges
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Matyáš Nowak"
        # Menu-bar utility: the UI lives in the top bar (the "B"), so no Dock icon.
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # Declare App Sandbox as a build setting too (not only via the entitlements
        # file): Xcode's App Store "Distribute" re-sign honors this, whereas a loose
        # entitlements file can get dropped from the main executable → upload validation
        # "App sandbox not enabled". Belt-and-suspenders with Badges.entitlements.
        ENABLE_APP_SANDBOX: YES
      configs:
        # The Release build (what ships to the Mac App Store) defines APPSTORE, which
        # compiles out the in-app "Donate" links — App Store review rejects external
        # donation links (they'd have to go through In-App Purchase). Donations live on
        # the GitHub repo instead. Debug/dev builds keep Donate visible. It also drops
        # the DMG-only "move to Applications" check (SetupChecks.swift). The direct-
        # download DMG is archived by scripts/release.sh with APPSTORE overridden away.
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
    entitlements:
      path: App/Badges.entitlements
      properties:
        # App Sandbox comes from the ENABLE_APP_SANDBOX build setting (single source) —
        # duplicating it here produced a duplicate entitlement key that broke the DER
        # entitlements the App Store validator reads ("App sandbox not enabled").
        com.apple.security.files.user-selected.read-only: true
        # Team-ID-prefixed app group: required for Developer ID (non-MAS) macOS
        # distribution; group.* would need a provisioning profile and prompts on
        # macOS 15+. $(TeamIdentifierPrefix) expands to "<TEAMID>." at build time.
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.matyasnowak.badges

  BadgesFinderExt:
    type: app-extension
    platform: macOS
    sources:
      - FinderExt
      - Shared
      - BadgeAssets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matyasnowak.badges.finderext
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FinderExt/BadgesFinderExt-Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
    entitlements:
      path: FinderExt/BadgesFinderExt.entitlements
      properties:
        # App Sandbox is provided by the ENABLE_APP_SANDBOX build setting (single source
        # of truth — avoids a duplicate entitlement key). FinderSync still requires the
        # sandbox; the build setting satisfies it.
        # Team-ID-prefixed app group: shared ruleset container between app + extension.
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.matyasnowak.badges

  # Logic tests for the Shared engine (priority resolution, matching). Compiles the
  # Shared sources directly so it needs no app test-host.
  BadgesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matyasnowak.badges.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Badges:
    build:
      targets:
        Badges: all
        BadgesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BadgesTests
    archive:
      config: Release
